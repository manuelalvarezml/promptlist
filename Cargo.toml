[package]
name = "promptlist"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
default-run = "promptlist"

[dependencies]
aws-credential-types = "=1.2.3"
aws-sigv4 = "=1.3.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
dotenvy = "0.15"
flate2 = "1"
fs2 = "0.4"
lambda_runtime = "0.14"
maud = "0.27"
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
tower = { version = "0.5", features = ["util"] }
quick-xml = { version = "0.38", features = ["serialize"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
